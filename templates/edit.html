<!DOCTYPE html>
<html>
<head>
    <title>Edit Entry</title>
</head>
<body>
    <h1>Edit Entry</h1>
    <form method="POST">
        <label>Date:</label>
        <input type="text" name="date" value="{{ entry.date }}"><br><br>

        <label>D.No:</label>
        <input type="text" name="dno" value="{{ entry.dno }}"><br><br>

        {% if show_pcs %}
        <label>PCS:</label>
        <input type="number" name="pcs" value="{{ entry.pcs }}"><br><br>
        {% endif %}

        <label>Weight:</label>
        <input type="number" step="0.01" name="weight" value="{{ entry.weight }}"><br><br>

        <button type="submit">Update</button>
    </form>
</body>
</html>
